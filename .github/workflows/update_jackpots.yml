name: Update lottery jackpots

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours. GitHub Actions cron uses UTC.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: jackpot-updater
  cancel-in-progress: true

jobs:
  update-jackpots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update jackpot values
        run: python scripts/update_jackpots.py

      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- lottery_data.json; then
            echo "No jackpot change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lottery_data.json
          git commit -m "Update Powerball and Mega Millions jackpots"
          git push
